name: Native macOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos-native:
    name: Apple-silicon source and image checks
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify native host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install native dependencies
        run: |
          brew install \
            actionlint \
            apko \
            cmake \
            cpio \
            dtc \
            libarchive \
            libusb \
            lz4 \
            pkg-config \
            ripgrep \
            shellcheck \
            zstd

      - name: Validate workflow and source
        run: |
          actionlint
          rg -l -0 '^#!/(bin/(ba)?sh|usr/bin/env (ba)?sh|sbin/openrc-run)' os tools \
            | xargs -0 -n 1 sh -n
          rg -l -0 '^#!/(bin/(ba)?sh|usr/bin/env (ba)?sh|sbin/openrc-run)' os tools \
            | xargs -0 shellcheck --shell=sh --severity=warning
          sh -n helm
          shellcheck --shell=sh --severity=warning helm
          for profile_definition in tools/helm-macos/profiles/*.conf; do
            sh -n "$profile_definition"
          done
          python3 -m py_compile \
            tools/helm-macos/build-r39-family-inputs.py \
            tools/helm-macos/build-rcm-blob.py \
            tools/helm-macos/helm-provision-console.py \
            tools/helm-macos/mkbootimg.py \
            tools/helm-web/prepare-site.py
          node --test \
            tools/helm-web/test/rcm.test.mjs \
            tools/helm-web/recovery.test.mjs \
            tools/helm-web/test/server.test.mjs
          node --check tools/helm-web/site/app.mjs
          node --check tools/helm-web/server.mjs
          tools/helm-web/prepare-site.py self-test
          tools/helm-macos/build-r39-family-inputs.py --self-test
          tools/helm-macos/build-rcm-blob.py --self-test
          tools/helm-macos/helm-provision-console.py --self-test
          tools/helm-macos/helm-macos self-test
          if helm_non_tty_output=$(./helm </dev/null 2>&1); then
            echo "zero-argument helm accepted non-terminal execution" >&2
            exit 1
          fi
          printf '%s\n' "$helm_non_tty_output" \
            | grep -q 'guided provisioning requires terminal output'
          sh os/alpine/initramfs/recovery-init self-test
          os/alpine/rootfs-overlay/usr/sbin/helm-install --help >/dev/null
          os/alpine/rootfs-overlay/usr/sbin/helm-install self-test
          os/alpine/rootfs-overlay/usr/sbin/helm-provision --help >/dev/null
          os/alpine/rootfs-overlay/usr/sbin/helm-provision self-test
          os/alpine/rootfs-overlay/usr/sbin/helm-qspi-install --help >/dev/null
          os/alpine/rootfs-overlay/usr/sbin/helm-qspi-install self-test
          test "$(shasum tools/helm-macos/profile-data/r39.2/helm-orin-nx-8gb-r39.2/qspi_bootblob_ver.txt \
            | awk '{print $1}')" = \
            91272c6e6bda545bb804856a093eb57168cda3ca
          test "$(tools/helm-macos/helm-macos profiles | wc -l | tr -d ' ')" = 5
          for profile in \
            helm-orin-nx-16gb-r39.2 \
            helm-orin-nx-8gb-r39.2 \
            helm-orin-nano-8gb-r39.2 \
            helm-orin-nano-4gb-r39.2 \
            helm-orin-nano-8gb-sd-r39.2
          do
            tools/helm-macos/helm-macos --profile "$profile" --help >/dev/null
            tools/helm-macos/helm-macos --profile "$profile" install-help \
              | grep -q -- "--confirm $profile"
            tools/helm-macos/helm-macos --profile "$profile" provision --help \
              | grep -q -- "--confirm-profile PROFILE"
            if tools/helm-macos/helm-macos --profile "$profile" provision \
              --device /dev/nvme0n1 --confirm-device /dev/nvme0n1 \
              --confirm-profile deliberately-wrong >/dev/null 2>&1
            then
              echo "provision accepted the wrong profile confirmation" >&2
              exit 1
            fi
          done

      - name: Test native Android boot-image builder
        run: |
          work=$(mktemp -d "${TMPDIR}/helm-bootimg.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf 'kernel-fixture' > "$work/Image"
          printf 'ramdisk-fixture' > "$work/initramfs.gz"
          tools/helm-macos/mkbootimg.py \
            --kernel "$work/Image" \
            --ramdisk "$work/initramfs.gz" \
            --output "$work/boot.img"
          test "$(dd if="$work/boot.img" bs=8 count=1 2>/dev/null)" = 'ANDROID!'
          file "$work/boot.img" | grep -q 'Android bootimg'

      - name: Resolve Alpine arm64 userspace natively
        run: |
          mkdir -p build
          apko build-minirootfs \
            --build-arch arm64 \
            os/alpine/apko.yaml \
            build/ci-rootfs.tar.gz
          archive_tool="$(brew --prefix libarchive)/bin/bsdtar"
          "$archive_tool" -tf build/ci-rootfs.tar.gz > build/ci-rootfs.list
          grep -qx 'sbin/init' build/ci-rootfs.list
          grep -qx 'sbin/sfdisk' build/ci-rootfs.list
          grep -qx 'usr/bin/zstd' build/ci-rootfs.list

      - name: Compile Helm device-tree overlay
        run: |
          mkdir -p build/ci-device-tree
          dtc -@ -I dts -O dtb \
            -o build/ci-device-tree/helm-p3768.dtbo \
            os/alpine/device-tree/helm-p3768.dtso
          test -s build/ci-device-tree/helm-p3768.dtbo

      - name: Build and test native APX tools
        run: |
          ./tools/apx-macos/build.sh
          build/macos-tools/bin/apxctl --help >/dev/null
          file build/macos-tools/bin/apxctl | grep -q 'Mach-O 64-bit executable arm64'
