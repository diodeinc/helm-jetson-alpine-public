contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  runtime_repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  packages:
    - alpine-base
    - ca-certificates
    - chrony
    - chrony-openrc
    - dhcpcd
    - dhcpcd-openrc
    - dropbear
    - dropbear-openrc
    - e2fsprogs
    - ethtool
    - eudev
    - eudev-openrc
    - i2c-tools
    - iproute2
    - kmod
    - libgpiod
    - lsblk
    - mkinitfs
    - mtd-utils
    - nvme-cli
    - openrc
    - pciutils
    - sfdisk
    - udev-init-scripts-openrc
    - util-linux
    - usbutils
    - zstd

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

archs:
  - arm64
